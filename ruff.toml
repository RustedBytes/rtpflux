# Lint for the Python test tooling (examples/scenarios, scripts): errors
# and likely bugs, not style. CI runs `ruff check` with this file.
line-length = 120
target-version = "py310"   # examples/scenarios/README.md: Python 3.10 or later

[lint]
select = [
    "E4", "E7", "E9",   # imports, statements, syntax
    "F",                # pyflakes: undefined and unused names
    "W",                # whitespace that hides mistakes
    "B",                # bugbear: likely bugs
    "PLE",              # pylint errors
]
ignore = [
    "B905",  # zip() without strict=: the scenarios zip lists of known equal length
    "E731",  # a lambda assigned to a name is fine in these scripts
]
