[workspace]
resolver = "3"
members = [
    "crates/rtpflux-core",
    "crates/rtpflux-ng",
    "crates/rtpflux-srtp",
    "crates/rtpflux-xdp-common",
    "crates/rtpflux-xdp",
    "crates/rtpflux-uring",
    "crates/rtpflux-bench",
    "crates/rtpflux-client",
    "crates/rtpflux-client-async",
    "crates/rtpflux",
]
# Built separately for the BPF target (nightly, build-std, bpf-linker).
exclude = ["crates/rtpflux-xdp-ebpf"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/RustedBytes/rtpflux"
description = "A fast RTP media relay"

[workspace.dependencies]
# `log` is the logging facade for every crate (no_std-capable without default
# features); the daemon installs `tracing-subscriber` as the backend, whose
# default `tracing-log` feature forwards `log` records.
nix = { version = "0.32.0", default-features = false, features = ["event", "net", "resource", "signal", "socket", "time", "uio"] }
log = { version = "0.4.35", default-features = false }
aya = { version = "0.16.0", default-features = false }
# io_uring (rtpflux-uring: multishot UDP receive with provided buffers),
# and the C types it is used with.
io-uring = { version = "0.7.16", default-features = false, features = ["io_safety"] }
libc = { version = "0.2.191", default-features = false }
# AF_XDP sockets (`af-xdp` feature of rtpflux-xdp); EUPL-1.2.
xdpilone = { version = "1.3.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The async client (rtpflux-client-async): Tokio, features chosen there.
tokio = { version = "1.54.1", default-features = false }
# Opus transcoding: a pure-Rust Opus codec (a port of libopus).
opus-rs = "0.1.42"
# Call recordings as audio files: FLAC, and Ogg (for Ogg Opus), pure Rust.
flacenc = { version = "0.5.1", default-features = false }
ogg = "0.9.2"
# MP3 recordings (the optional `mp3` feature): LAME, a C library (LGPL).
mp3lame-encoder = "0.3.0"
# Recordings to S3 (the optional `s3` feature): request signing, and a small
# blocking HTTPS client (rustls, whose ring provider builds C and assembly).
rusty-s3 = { version = "0.12.0", default-features = false, features = ["rustcrypto"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
url = "2.5.9"
# DTLS handshakes (DTLS-SRTP keying): pure Rust, on RustCrypto.
# Only the benchmark tool (rtpflux-bench); the daemon parses its own
# five options.
clap = { version = "4.6.9", features = ["derive"] }
# G.729 (+ Annex B): a pure-Rust port of bcg729 (GPL-3.0; the crate says
# MIT, but its code derives from bcg729, so it is treated as GPL-3.0).
g729-sys = { version = "=0.3.0" }
# AMR and AMR-WB (feature `amr` of the daemon): pure-Rust ports of
# opencore-amr (Apache-2.0).
amr-nb = { version = "=0.2.2" }
amr-wb = { version = "=0.4.3" }
dimpl = { version = "0.9.0", default-features = false, features = ["rust-crypto"] }
# The relay's self-signed DTLS certificate.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
x509-cert = { version = "0.3.1", default-features = false, features = ["builder", "std"] }
# Wiping DTLS keying material (already a dependency of the RustCrypto crates).
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"] }
rand = "0.10"
# Certificate fingerprints and the DTLS-SRTP exporter.
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11", default-features = false }
hmac = "0.13.0"
toml = { version = "1.2.2", default-features = false, features = ["std", "serde", "parse"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std", "tracing-log"] }
# The web UI's log ring reads events through tracing-subscriber's `Layer`.
tracing-core = { version = "0.1.36", default-features = false, features = ["std"] }

[workspace.lints.rust]
# `deny` here, not `forbid`: `rtpflux-xdp`'s `pod` module (aya's `Pod` is an
# unsafe trait) and `xsk` module (`AF_XDP` memory), and `rtpflux-uring`'s
# `ring` module (`io_uring` memory), are the exceptions. Every other crate
# forbids `unsafe` at its root, which no `allow` can undo. See AGENTS.md §5.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# rtp/rtcp, a_rtp/a_rtcp: the protocol's own vocabulary.
similar_names = "allow"
