#
# OpenSIPS (3.4 or later) as an edge proxy in front of a PBX (FreeSWITCH,
# an Asterisk, another proxy), with rtpflux relaying the media through
# OpenSIPS's `rtpengine` module (rtpflux speaks the same ng protocol).
# The same call handling as contrib/kamailio/kamailio.cfg.
#
# Every INVITE is sent to the PBX. OpenSIPS record-routes, so in-dialog
# requests (re-INVITE, BYE) come back through it, and rewrites each SDP
# with rtpflux's address and ports: offers in requests, answers in
# replies; BYE, CANCEL and failures delete the call in rtpflux.
#
# Settings: where OpenSIPS listens (`socket`) and rtpflux's ng socket
# (`rtpengine_sock`) are below; edit them. At run time, from the
# environment, with these defaults:
#
#   PBX_URI        sip:127.0.0.1:5080             where calls go
#   RTPFLUX_FLAGS  trust-address replace-origin   flags of every offer
#                                                 and answer
#
# This file is also the OpenSIPS configuration of the integration test
# bench (integration/), which checks real calls through it.

log_level = 3
stderror_enabled = yes
syslog_enabled = no
udp_workers = 4

socket = udp:0.0.0.0:5060

# Where the modules are: Debian and Ubuntu packages (and the official
# opensips/opensips images) on x86-64; adjust for other systems.
mpath = "/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "proto_udp.so"
loadmodule "cfgutils.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "signaling.so"
loadmodule "rtpengine.so"

# rtpflux's ng socket; several can be listed for load sharing, as with
# rtpengine. A command that is not answered is sent again (rtpflux
# answers a retransmitted command from its reply cache, so a retry never
# creates a second call).
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("rtpengine", "rtpengine_retr", 3)

route {
    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    # In-dialog requests follow the recorded route.
    if (has_totag()) {
        if (loose_route()) {
            route(relay);
        }
        if (is_method("ACK")) {
            # An ACK for a negative reply, absorbed by the transaction.
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }
        send_reply(404, "Not here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(relay);
        }
        exit;
    }

    # Retransmissions are handled by the transaction layer.
    t_check_trans();

    if (is_method("OPTIONS") && $rU == NULL) {
        send_reply(200, "Keepalive");
        exit;
    }

    if (!is_method("INVITE")) {
        send_reply(405, "Method Not Allowed");
        exit;
    }

    # A new call: through this proxy, to the PBX.
    record_route();
    if ($env(PBX_URI) != NULL) {
        $du = $env(PBX_URI);
    } else {
        $du = "sip:127.0.0.1:5080";
    }
    route(relay);
}

route[relay] {
    route(media);
    if (is_method("INVITE|UPDATE")) {
        t_on_reply("media_reply");
        t_on_failure("media_failed");
    }
    if (!t_relay()) {
        send_reply(500, "Server Internal Error");
    }
    exit;
}

route[flags] {
    if ($env(RTPFLUX_FLAGS) != NULL) {
        $var(flags) = $env(RTPFLUX_FLAGS);
    } else {
        $var(flags) = "trust-address replace-origin";
    }
}

# Offers (and late-offer answers in ACK) through rtpflux; BYE and CANCEL
# end the call there.
route[media] {
    if (is_method("BYE|CANCEL")) {
        rtpengine_delete();
    } else if (has_body("application/sdp")) {
        route(flags);
        rtpengine_manage($var(flags));
    }
}

onreply_route[media_reply] {
    if (has_body("application/sdp")) {
        route(flags);
        rtpengine_manage($var(flags));
    }
}

failure_route[media_failed] {
    if (t_was_cancelled()) {
        exit;
    }
    # The call failed: free its ports in rtpflux.
    rtpengine_delete();
}
