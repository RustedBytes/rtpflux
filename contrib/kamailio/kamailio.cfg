#!KAMAILIO
#
# Kamailio as a stateless-ish edge proxy in front of a PBX (FreeSWITCH, an
# Asterisk, another proxy), with rtpflux relaying the media through
# Kamailio's `rtpengine` module (rtpflux speaks the same ng protocol).
#
# Every INVITE is sent to the PBX. Kamailio record-routes, so in-dialog
# requests (re-INVITE, BYE) come back through it, and rewrites each SDP
# with rtpflux's address and ports: offers in requests, answers in
# replies; BYE, CANCEL and failures delete the call in rtpflux.
#
# Settings come from the environment (Kamailio 5.6 or later), with the
# defaults below:
#
#   KAMAILIO_LISTEN   udp:0.0.0.0:5060      where Kamailio listens
#   KAMAILIO_ADVERTISE                      address put in Via / Record-Route
#                                           when the listen address is 0.0.0.0
#   PBX_URI           sip:127.0.0.1:5080    where calls go
#   RTPFLUX_NG        udp:127.0.0.1:2223    rtpflux's ng control socket
#   RTPFLUX_FLAGS     trust-address replace-origin
#                                           flags of every offer and answer
#
# This file is also the configuration of the integration test bench
# (integration/), which checks real calls through it.

# (The listen settings are tokens, not strings: #!trydefenv, unquoted.)
#!trydefenv KAMAILIO_LISTEN
#!ifndef KAMAILIO_LISTEN
#!define KAMAILIO_LISTEN udp:0.0.0.0:5060
#!endif
#!trydefenv KAMAILIO_ADVERTISE
#!trydefenvs PBX_URI
#!ifndef PBX_URI
#!define PBX_URI "sip:127.0.0.1:5080"
#!endif
#!trydefenvs RTPFLUX_NG
#!ifndef RTPFLUX_NG
#!define RTPFLUX_NG "udp:127.0.0.1:2223"
#!endif
#!trydefenvs RTPFLUX_FLAGS
#!ifndef RTPFLUX_FLAGS
#!define RTPFLUX_FLAGS "trust-address replace-origin"
#!endif

debug=2
log_stderror=yes
fork=yes
children=4
auto_aliases=no

#!ifdef KAMAILIO_ADVERTISE
listen=KAMAILIO_LISTEN advertise KAMAILIO_ADVERTISE
#!else
listen=KAMAILIO_LISTEN
#!endif

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "rtpengine.so"

# rtpflux's ng socket; several can be listed for load sharing, as with
# rtpengine.
modparam("rtpengine", "rtpengine_sock", RTPFLUX_NG)
# Answers within a second, three tries (rtpflux answers retransmitted
# commands from its reply cache, so a retry never creates a second call).
modparam("rtpengine", "rtpengine_tout_ms", 1000)
modparam("rtpengine", "rtpengine_retr", 3)

modparam("rr", "enable_full_lr", 1)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # In-dialog requests follow the recorded route.
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        }
        if (is_method("ACK")) {
            # An ACK for a negative reply, absorbed by the transaction.
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }
        sl_send_reply("404", "Not here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Retransmissions are handled by the transaction layer.
    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    if (is_method("OPTIONS") && $rU == $null) {
        sl_send_reply("200", "Keepalive");
        exit;
    }

    if (!is_method("INVITE")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # A new call: through this proxy, to the PBX.
    record_route();
    $du = PBX_URI;
    route(RELAY);
}

route[RELAY] {
    route(MEDIA);
    if (is_method("INVITE|UPDATE")) {
        t_on_reply("MEDIA_REPLY");
        t_on_failure("MEDIA_FAILED");
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Offers (and late-offer answers in ACK) through rtpflux; BYE and CANCEL
# end the call there.
route[MEDIA] {
    if (is_method("BYE|CANCEL")) {
        rtpengine_delete();
    } else if (has_body("application/sdp")) {
        rtpengine_manage(RTPFLUX_FLAGS);
    }
}

onreply_route[MEDIA_REPLY] {
    if (has_body("application/sdp")) {
        rtpengine_manage(RTPFLUX_FLAGS);
    }
}

failure_route[MEDIA_FAILED] {
    if (t_is_canceled()) {
        exit;
    }
    # The call failed: free its ports in rtpflux.
    rtpengine_delete();
}
