# Cross-repository test: ferrosip's sip-ua engines (pinned by `rev` below)
# drive a B2BUA that anchors media in rtpflux through rtpflux-client-async.
# Outside the workspace: ferrosip is a private repository, and the
# workspace must build without it. Run it with run.sh.
[package]
name = "ferroswitch-e2e"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false

[workspace]

[dev-dependencies]
# ferrosip 60b20fc: sip-ua with B2BUA support.
sip-ua = { git = "ssh://git@github.com/RustedBytes/ferrosip.git", rev = "60b20fc2ee38eba830705ee2e257f6da7b9eaf4a", default-features = false }
rtpflux = { path = "../../crates/rtpflux" }
rtpflux-client-async = { path = "../../crates/rtpflux-client-async" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time"] }
